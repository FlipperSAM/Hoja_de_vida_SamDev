<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Andrés Abella Pérez | Ingeniería de Sistemas & Full Stack</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: rgba(17, 26, 54, 0.78);
            --border-color: rgba(56, 189, 248, 0.22);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --cyan: #38bdf8;
            --emerald: #34d399;
            --purple: #c084fc;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.12), transparent 35%),
                              radial-gradient(circle at 85% 80%, rgba(52, 211, 153, 0.10), transparent 35%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            padding: 2.5rem 1rem 4rem;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.75rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            transition: transform 0.25s ease, border-color 0.25s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, 0.5);
        }
        .header-card {
            position: relative;
            overflow: hidden;
            margin-bottom: 1.75rem;
        }
        .top-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #22d3ee, #34d399);
        }
        .header-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.25rem;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: var(--cyan);
            font-weight: 600;
            font-size: 0.95rem;
        }
        .contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 0.75rem;
        }
        .contact-row a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .contact-row a:hover {
            color: var(--cyan);
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.35);
            color: var(--emerald);
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: var(--emerald);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--emerald);
        }
        .social-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-top: 1.35rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(148, 163, 184, 0.15);
        }
        .social-btn {
            display: inline-block;
            padding: 0.4rem 0.85rem;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 0.5rem;
            color: #f8fafc;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .social-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.75rem;
        }
        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1.85fr;
            }
        }
        .col-stack {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }
        .section-title {
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #ffffff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-title::before {
            content: "";
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, #38bdf8, #34d399);
            border-radius: 4px;
        }
        .profile-text {
            font-size: 0.88rem;
            color: var(--text-muted);
            text-align: justify;
        }
        .lang-item {
            margin-bottom: 1rem;
        }
        .lang-item:last-child {
            margin-bottom: 0;
        }
        .lang-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        .bar-bg {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 999px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #22d3ee);
            border-radius: 999px;
        }
        .stack-group {
            margin-bottom: 1.25rem;
        }
        .stack-group:last-child {
            margin-bottom: 0;
        }
        .stack-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }
        .badges-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
        }
        .badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 0.45rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #e2e8f0;
        }
        .badge-cyan { color: var(--cyan); border-color: rgba(56, 189, 248, 0.3); }
        .badge-emerald { color: var(--emerald); border-color: rgba(52, 211, 153, 0.3); }
        .badge-purple { color: var(--purple); border-color: rgba(192, 132, 252, 0.3); }
        .project-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.65rem;
        }
        .project-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }
        .project-link {
            font-size: 0.8rem;
            color: var(--cyan);
            text-decoration: none;
            font-weight: 600;
        }
        .project-link:hover {
            text-decoration: underline;
        }
        .edu-item {
            margin-bottom: 1rem;
        }
        .edu-item:last-child {
            margin-bottom: 0;
        }
        .edu-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: #ffffff;
        }
        .edu-sub {
            font-size: 0.82rem;
            color: var(--text-muted);
        }
    </style>
</head>
